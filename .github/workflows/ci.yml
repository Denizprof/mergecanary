name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: git identity for fixtures
        shell: bash
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: go vet ./...
      - run: go test -race ./...
